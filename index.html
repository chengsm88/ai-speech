<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 防止發送 Referer 標頭，避免線上語音服務回傳 404 錯誤 -->
    <meta name="referrer" content="no-referrer">
    <title>AI 語音合成助手 (Text to Speech)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        /* 自訂文字框捲軸樣式 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #c7c7cc; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a1a1a6; 
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-blue-50 to-purple-100 min-h-screen font-sans text-gray-800 antialiased flex flex-col">

    <!-- 自定義聲音彈窗 (Custom Voice Modal) -->
    <div id="custom-voice-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeCustomVoiceModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl z-10 w-full max-w-md p-6 m-4 transform transition-all">
            <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-500"></i> 創建自定義聲音
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">聲音名稱</label>
                    <input type="text" id="cv-name" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如：小老鼠音、廣東話大叔">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">基礎聲音</label>
                    <select id="cv-base-voice" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                        <span>音高 (Pitch)</span> <span id="cv-pitch-val" class="text-indigo-600 font-bold">1.0</span>
                    </label>
                    <input type="range" id="cv-pitch" min="0" max="2" step="0.1" value="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                        <span>基礎語速 (Rate)</span> <span id="cv-rate-val" class="text-indigo-600 font-bold">1.0</span>
                    </label>
                    <input type="range" id="cv-rate" min="0.1" max="2" step="0.1" value="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button type="button" onclick="testCustomVoice()" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-play mr-1"></i> 試聽
                </button>
                <button type="button" onclick="saveCustomVoice()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition-colors shadow-lg">
                    <i class="fa-solid fa-check mr-1"></i> 儲存
                </button>
            </div>
        </div>
    </div>

    <!-- 通知提示容器 (Toast Notification Container) -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <div class="glass-panel w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden border border-white/40">
            
            <!-- 頂部標題欄 (Header) -->
            <div class="bg-indigo-600 px-8 py-6 text-white flex items-center justify-between">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-3">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        AI 語音合成助手
                    </h1>
                    <p class="text-indigo-100 mt-2 text-sm sm:text-base">將文字轉化為自然流暢的語音，支援廣東話、英文與普通話。</p>
                </div>
                <div class="hidden sm:block text-4xl opacity-80">
                    <i class="fa-solid fa-microphone-lines"></i>
                </div>
            </div>

            <!-- 主要內容區 (Content Body) -->
            <div class="p-6 sm:p-8">
                
                <!-- 語言、聲音、語速控制列 (Controls Row) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
                    <!-- 語言選擇 -->
                    <div>
                        <label for="language" class="block text-sm font-medium text-gray-700 mb-2">語言 (Language)</label>
                        <div class="relative">
                            <select id="language" class="block w-full pl-4 pr-10 py-3 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl appearance-none border transition-colors">
                                <option value="zh-HK">🇭🇰 廣東話 (Cantonese)</option>
                                <option value="en">🇬🇧/🇺🇸 英文 (English)</option>
                                <option value="zh-CN">🇨🇳 普通話 (Mandarin)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <i class="fa-solid fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 聲音選擇 (自訂下拉選單) -->
                    <div class="relative" id="voice-dropdown-container">
                        <label class="block text-sm font-medium text-gray-700 mb-2">聲音 (Voice)</label>
                        <div id="voice-select-btn" class="flex items-center justify-between w-full pl-4 pr-4 py-3 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:text-sm rounded-xl border cursor-pointer transition-colors shadow-sm hover:bg-gray-100">
                            <div class="flex items-center gap-3 truncate" id="selected-voice-display">
                                <span class="text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>正在載入聲音...</span>
                            </div>
                            <i class="fa-solid fa-chevron-down text-sm text-gray-500 transition-transform duration-200" id="voice-chevron"></i>
                        </div>
                        <div id="voice-options-menu" class="absolute z-20 mt-2 w-full bg-white shadow-2xl max-h-80 rounded-2xl py-2 text-base ring-1 ring-black ring-opacity-5 overflow-hidden flex flex-col focus:outline-none sm:text-sm hidden opacity-0 transition-opacity duration-200">
                            <div id="voice-list-container" class="px-2 overflow-y-auto max-h-60 flex flex-col gap-1"></div>
                            <div id="custom-voice-btn-container" class="border-t border-gray-100 mt-2 pt-2 px-2 bg-gray-50/50">
                                <button type="button" class="w-full flex items-center justify-between px-3 py-2.5 text-sm text-gray-800 hover:bg-gray-100 rounded-xl cursor-pointer transition-colors font-medium" onclick="openCustomVoiceModal()">
                                    <div class="flex items-center gap-3">
                                        <div class="bg-black text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">
                                            <i class="fa-solid fa-plus"></i>
                                        </div>
                                        創建自定義聲音
                                    </div>
                                    <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 語速選擇 -->
                    <div>
                        <label for="speech-rate" class="block text-sm font-medium text-gray-700 mb-2">語速 (Speed)</label>
                        <div class="relative">
                            <select id="speech-rate" class="block w-full pl-4 pr-10 py-3 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl appearance-none border transition-colors">
                                <option value="0.5">0.5x (極慢)</option>
                                <option value="0.8">0.8x (稍慢)</option>
                                <option value="1" selected>1.0x (正常)</option>
                                <option value="1.2">1.2x (稍快)</option>
                                <option value="1.5">1.5x (極快)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <i class="fa-solid fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 文字輸入區 (Text Input) -->
                <div class="mb-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 gap-2">
                        <label for="text-input" class="block text-sm font-medium text-gray-700">輸入文字 (Text Input)</label>
                    </div>
                    <textarea id="text-input" rows="6" class="shadow-sm block w-full p-4 text-gray-900 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-base bg-gray-50 resize-y transition-colors" placeholder="請在此輸入您想要轉換為語音的文字..."></textarea>
                    
                    <div class="mt-3 flex flex-col gap-2 text-xs text-gray-500">
                        <div id="cantonese-hint" class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 flex items-start gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 mt-0.5"></i>
                            <div class="flex-1">
                                <p class="text-indigo-800 font-medium mb-1">廣東話發音優化 (無需連網)</p>
                                <label class="flex items-center gap-2 cursor-pointer text-indigo-600">
                                    <input type="checkbox" id="auto-translate-hk" checked class="rounded border-indigo-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                                    <span>朗讀及匯出時，自動將「書面語」(如：我們、今天) 轉換為「廣東話口語」(我哋、今日) 以獲得更自然標準的發音。</span>
                                </label>
                            </div>
                        </div>
                        <div id="fallback-voice-hint" class="hidden bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-800 flex items-start gap-2">
                            <i class="fa-solid fa-circle-info text-amber-500 mt-0.5"></i>
                            <span>偵測到此手機未安裝專屬廣東話語音包，已自動為您切換至裝置內建的可用語音包，無需額外下載即可直接朗讀。</span>
                        </div>
                        <div class="flex justify-between items-center mt-1 px-1">
                            <span>支援長文本，系統會自動根據選擇的語言進行語氣調整。</span>
                            <span id="char-count" class="font-medium bg-gray-200 py-0.5 px-2 rounded-md">0 字</span>
                        </div>
                    </div>
                </div>

                <!-- 主要操作按鈕 (Main Action Buttons) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button type="button" id="generate-btn" class="w-full flex items-center justify-center py-4 px-6 border border-transparent rounded-xl shadow-lg text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                        <i class="fa-solid fa-bullhorn mr-2"></i> 開始朗讀 (Speak)
                    </button>
                    <button type="button" id="download-mp3-btn" class="w-full flex items-center justify-center py-4 px-6 border border-transparent rounded-xl shadow-lg text-lg font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                        <i class="fa-solid fa-file-audio mr-2"></i> 匯出 / 下載 MP3
                    </button>
                </div>

                <!-- 朗讀播放控制列 (僅在朗讀時顯示) -->
                <div id="result-area" class="mt-6 pt-6 border-t border-gray-200 hidden opacity-0 transition-opacity duration-300">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-volume-high text-indigo-500 animate-pulse"></i> 正在朗讀控制
                    </h3>
                    <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 flex flex-col sm:flex-row gap-3">
                        <button type="button" id="pause-resume-btn" class="flex-1 flex items-center justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 focus:outline-none transition-colors">
                            <i class="fa-solid fa-pause mr-2"></i> 暫停 / 繼續
                        </button>
                        <button type="button" id="stop-btn" class="flex-1 flex items-center justify-center py-2.5 px-4 border border-gray-300 rounded-xl shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none transition-colors">
                            <i class="fa-solid fa-stop mr-2"></i> 停止播放
                        </button>
                    </div>
                </div>

                <!-- MP3 音檔試聽與下載面板 (MP3 Export & Preview Panel) -->
                <div id="mp3-export-area" class="mt-6 pt-6 border-t border-gray-200 hidden">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-base font-bold text-gray-900 flex items-center gap-2">
                            <i class="fa-solid fa-download text-emerald-600"></i> MP3 音檔下載區
                        </h3>
                        <button type="button" onclick="document.getElementById('mp3-export-area').classList.add('hidden')" class="text-xs text-gray-400 hover:text-gray-600 p-1">
                            <i class="fa-solid fa-times"></i> 收起
                        </button>
                    </div>

                    <!-- 自然人聲版 MP3 卡片 -->
                    <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-4 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm font-bold text-emerald-900">自然人聲版 MP3</span>
                                <span class="text-[11px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full font-medium">限 200 字</span>
                            </div>
                            <p class="text-xs text-emerald-700 mb-3">可直接試聽或點擊按鈕開啟音檔儲存（手機請點播放器右側 <code class="bg-white px-1 rounded">⋮</code> 下載）。</p>
                            <audio id="online-mp3-player" controls referrerpolicy="no-referrer" class="w-full h-10 mb-3 rounded-lg"></audio>
                        </div>
                        <a id="online-mp3-link" href="#" target="_blank" rel="noreferrer noopener" class="w-full inline-flex items-center justify-center py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors shadow-sm">
                            <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> 開啟音檔並儲存 MP3
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-gray-500 text-sm">
        <p>Powered by Web Speech API</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 取得 DOM 元素
        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const generateBtn = document.getElementById('generate-btn');
        const languageSelect = document.getElementById('language');
        const resultArea = document.getElementById('result-area');
        const pauseResumeBtn = document.getElementById('pause-resume-btn');
        const stopBtn = document.getElementById('stop-btn');
        const toastContainer = document.getElementById('toast-container');
        const cantoneseHint = document.getElementById('cantonese-hint');
        const fallbackVoiceHint = document.getElementById('fallback-voice-hint');
        const autoTranslateHk = document.getElementById('auto-translate-hk');
        const downloadMp3Btn = document.getElementById('download-mp3-btn');
        const speechRateSelect = document.getElementById('speech-rate');
        
        // MP3 匯出區元素
        const mp3ExportArea = document.getElementById('mp3-export-area');
        const onlineMp3Player = document.getElementById('online-mp3-player');
        const onlineMp3Link = document.getElementById('online-mp3-link');
        
        // 自訂聲音下拉選單元素
        const voiceSelectBtn = document.getElementById('voice-select-btn');
        const voiceOptionsMenu = document.getElementById('voice-options-menu');
        const voiceListContainer = document.getElementById('voice-list-container');
        const selectedVoiceDisplay = document.getElementById('selected-voice-display');
        const voiceChevron = document.getElementById('voice-chevron');

        // 應用程式狀態
        let voices = [];
        const synth = window.speechSynthesis;
        let isPaused = false;
        let selectedVoiceObj = null;
        let dropdownOpen = false;
        let iosAudioUnlocked = false;

        // 自定義聲音設定 (儲存於 localStorage)
        let customVoices = [];
        try {
            customVoices = JSON.parse(localStorage.getItem('customVoices')) || [];
        } catch (err) {
            customVoices = [];
        }
        let currentPitch = 1;
        let currentRate = 1;

        // 解鎖 iOS / 手機瀏覽器的語音引擎限制
        function unlockMobileSpeech() {
            if (iosAudioUnlocked || !synth) return;
            try {
                const silentUtterance = new SpeechSynthesisUtterance('');
                silentUtterance.volume = 0;
                synth.speak(silentUtterance);
                iosAudioUnlocked = true;
                if (voices.length === 0) {
                    populateVoiceList();
                }
            } catch (e) {
                console.warn('Speech unlock skipped:', e);
            }
        }
        document.addEventListener('touchstart', unlockMobileSpeech, { once: true, passive: true });
        document.addEventListener('click', unlockMobileSpeech, { once: true });

        // 切換聲音下拉選單顯示/隱藏
        function toggleDropdown(show) {
            dropdownOpen = show !== undefined ? show : !dropdownOpen;
            if (dropdownOpen) {
                voiceOptionsMenu.classList.remove('hidden');
                voiceChevron.classList.add('rotate-180');
                setTimeout(() => voiceOptionsMenu.classList.remove('opacity-0'), 10);
            } else {
                voiceOptionsMenu.classList.add('opacity-0');
                voiceChevron.classList.remove('rotate-180');
                setTimeout(() => voiceOptionsMenu.classList.add('hidden'), 200);
            }
        }

        voiceSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            const container = document.getElementById('voice-dropdown-container');
            if (container && !container.contains(e.target)) {
                toggleDropdown(false);
            }
        });

        // 根據聲線名稱產生漸層頭像顏色
        function getGradient(name, isCustom = false) {
            if (isCustom) return 'bg-gradient-to-r from-amber-300 via-yellow-400 to-orange-500';
            if (name.includes('Maan') || name.toLowerCase().includes('female') || name.includes('曉曼') || name.includes('Ting-Ting') || name.includes('Sin-ji')) {
                return 'bg-gradient-to-br from-purple-500 via-fuchsia-400 to-orange-300';
            }
            if (name.includes('Gaai') || name.includes('曉佳')) {
                return 'bg-gradient-to-br from-blue-500 via-indigo-400 to-cyan-300';
            }
            if (name.includes('Lung') || name.toLowerCase().includes('male') || name.includes('雲龍') || name.includes('Danny')) {
                return 'bg-gradient-to-br from-cyan-500 via-blue-500 to-indigo-600';
            }
            return 'bg-gradient-to-br from-gray-400 to-gray-500';
        }

        // 格式化顯示聲線名稱
        function formatVoiceName(name) {
            const formatted = name
                .replace('Microsoft ', '')
                .replace(' Online (Natural) - Chinese (Hong Kong)', '')
                .replace(' Online (Natural)', '');
            if (formatted.includes('HiuMaan')) return 'HiuMaan (Female)';
            if (formatted.includes('HiuGaai')) return 'HiuGaai (Female)';
            if (formatted.includes('WanLung')) return 'WanLung (Male)';
            if (name === 'Sin-ji' || name === 'Ting-Ting' || name === 'Mei-Jia') return `${name} (Female)`;
            if (name === 'Danny') return `${name} (Male)`;
            return formatted;
        }

        // 載入並過濾裝置可用聲線 (含手機免下載自動降級 Fallback 機制)
        function populateVoiceList() {
            const selectedLang = languageSelect.value;
            voiceListContainer.innerHTML = '';
            fallbackVoiceHint.classList.add('hidden');
            
            if (!synth) {
                selectedVoiceDisplay.innerHTML = '<span class="text-red-500">瀏覽器不支援語音合成</span>';
                return;
            }

            voices = synth.getVoices();
            if (voices.length === 0) {
                selectedVoiceDisplay.innerHTML = '<span class="text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>等待系統載入聲音...</span>';
                return;
            }

            let bestVoiceDiv = null;
            let priorityVoiceFound = false;

            function createOption(displayName, voiceObj, isCustom = false, config = null) {
                const gradientClass = getGradient(displayName, isCustom);
                
                const optionDiv = document.createElement('div');
                optionDiv.className = 'flex items-center justify-between px-3 py-2.5 cursor-pointer rounded-xl hover:bg-gray-100 transition-colors';
                
                const iconHtml = isCustom ? '<i class="fa-solid fa-star text-amber-500 text-xs ml-2"></i>' : '';
                
                optionDiv.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <div class="w-8 h-8 rounded-lg shadow-inner flex-shrink-0 ${gradientClass} border border-white/20"></div>
                        <span class="text-gray-800 font-medium truncate text-sm">${displayName} ${iconHtml}</span>
                    </div>
                `;

                if (isCustom) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can text-red-400 hover:text-red-600 transition-colors"></i>';
                    deleteBtn.className = 'p-1.5 z-10 rounded-md hover:bg-red-50';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        customVoices = customVoices.filter(cv => cv.name !== displayName);
                        localStorage.setItem('customVoices', JSON.stringify(customVoices));
                        populateVoiceList();
                    };
                    optionDiv.appendChild(deleteBtn);
                }

                optionDiv.onclick = (e) => {
                    e.stopPropagation();
                    selectedVoiceObj = voiceObj;
                    
                    if (isCustom && config) {
                        currentPitch = config.pitch;
                        currentRate = config.rate;
                    } else {
                        currentPitch = 1;
                        currentRate = 1;
                    }
                    
                    Array.from(voiceListContainer.children).forEach(child => child.classList.remove('bg-indigo-50'));
                    optionDiv.classList.add('bg-indigo-50');

                    selectedVoiceDisplay.innerHTML = `
                        <div class="w-6 h-6 rounded-md shadow-sm flex-shrink-0 ${gradientClass}"></div>
                        <span class="text-gray-800 font-medium truncate">${displayName}</span>
                    `;
                    toggleDropdown(false);
                };

                voiceListContainer.appendChild(optionDiv);

                if (!bestVoiceDiv) {
                    bestVoiceDiv = optionDiv;
                } else if (!priorityVoiceFound && (
                    displayName.includes('HiuMaan') ||
                    displayName.includes('HiuGaai') ||
                    displayName.includes('Sin-ji')
                )) {
                    bestVoiceDiv = optionDiv;
                    priorityVoiceFound = true;
                }
            }

            // 1. 精準比對目標語言 (支援 zh-HK 與 yue)
            let filteredVoices = voices.filter(voice => {
                const langLower = voice.lang.toLowerCase();
                if (selectedLang === 'zh-HK') {
                    return langLower.includes('zh-hk') || langLower.includes('yue');
                }
                if (selectedLang === 'zh-CN') {
                    return langLower.includes('zh-cn') || langLower.includes('cmn');
                }
                return langLower.startsWith(selectedLang.toLowerCase());
            });

            // 2. 手機免安裝語音包 Fallback：若無專屬廣東話，自動退而求其次使用其他中文語音包
            if (filteredVoices.length === 0 && (selectedLang === 'zh-HK' || selectedLang === 'zh-CN')) {
                filteredVoices = voices.filter(voice => voice.lang.toLowerCase().startsWith('zh'));
                if (filteredVoices.length > 0 && selectedLang === 'zh-HK') {
                    fallbackVoiceHint.classList.remove('hidden');
                }
            }

            // 3. 最終底線 Fallback：若連中文語音包都未載入，顯示裝置內建其他可用聲音
            if (filteredVoices.length === 0) {
                filteredVoices = voices;
                if (filteredVoices.length > 0 && selectedLang === 'zh-HK') {
                    fallbackVoiceHint.classList.remove('hidden');
                }
            }

            // 渲染自定義聲音
            customVoices.forEach(cv => {
                const baseVoice = voices.find(v => v.voiceURI === cv.baseVoiceURI);
                if (baseVoice) {
                    createOption(cv.name, baseVoice, true, cv);
                }
            });

            // 渲染系統內建聲音
            if (filteredVoices.length === 0 && customVoices.length === 0) {
                selectedVoiceDisplay.innerHTML = '<span class="text-red-500">此設備無可用聲線</span>';
                selectedVoiceObj = null;
            } else {
                filteredVoices.forEach(voice => {
                    createOption(formatVoiceName(voice.name), voice, false);
                });
            }

            if (bestVoiceDiv) {
                bestVoiceDiv.click();
            }
        }

        populateVoiceList();
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoiceList;
        }

        // 字數統計
        textInput.addEventListener('input', () => {
            const count = textInput.value.length;
            charCount.textContent = `${count} 字`;
        });

        // 切換語言
        languageSelect.addEventListener('change', () => {
            if (languageSelect.value === 'zh-HK') {
                cantoneseHint.classList.remove('hidden');
            } else {
                cantoneseHint.classList.add('hidden');
            }
            populateVoiceList();
        });

        // --- 廣東話書面語轉口語字典 ---
        const cantoneseDict = [
            { zh: '為什麼', jyut: '點解' }, { zh: '爲什麽', jyut: '點解' },
            { zh: '我們', jyut: '我哋' }, { zh: '你們', jyut: '你哋' },
            { zh: '他們', jyut: '佢哋' }, { zh: '她們', jyut: '佢哋' }, { zh: '它們', jyut: '佢哋' },
            { zh: '我的', jyut: '我嘅' }, { zh: '你的', jyut: '你嘅' }, 
            { zh: '他的', jyut: '佢嘅' }, { zh: '她的', jyut: '佢嘅' },
            { zh: '誰的', jyut: '邊個嘅' }, { zh: '是的', jyut: '係嘅' }, { zh: '好的', jyut: '好嘅' },
            { zh: '今天', jyut: '今日' }, { zh: '明天', jyut: '聽日' }, { zh: '昨天', jyut: '尋日' },
            { zh: '現在', jyut: '依家' }, { zh: '東西', jyut: '嘢' },
            { zh: '在哪裡', jyut: '喺邊度' }, { zh: '哪裡', jyut: '邊度' }, { zh: '這裡', jyut: '呢度' }, { zh: '那裡', jyut: '嗰度' },
            { zh: '什麼', jyut: '咩' }, { zh: '什麽', jyut: '咩' }, { zh: '怎麼', jyut: '點樣' },
            { zh: '沒有', jyut: '冇' }, { zh: '不知道', jyut: '唔知' }, { zh: '真的', jyut: '真係' },
            { zh: '但是', jyut: '但係' }, { zh: '可是', jyut: '不過' },
            { zh: '漂亮', jyut: '靚' }, { zh: '喜歡', jyut: '鍾意' },
            { zh: '睡覺', jyut: '瞓覺' }, { zh: '說話', jyut: '講嘢' },
            { zh: '告訴', jyut: '話畀' }, { zh: '給', jyut: '畀' },
            { zh: '這個', jyut: '呢個' }, { zh: '那個', jyut: '嗰個' }, { zh: '哪個', jyut: '邊個' },
            { zh: '這些', jyut: '呢啲' }, { zh: '那些', jyut: '嗰啲' }, { zh: '哪些', jyut: '邊啲' },
            { zh: '不用', jyut: '唔使' }, { zh: '不要', jyut: '唔好' }, { zh: '不能', jyut: '唔可以' },
            { zh: '不會', jyut: '唔識' }, { zh: '不行', jyut: '唔得' }, { zh: '不是', jyut: '唔係' },
            { zh: '非常', jyut: '好' }, { zh: '很', jyut: '好' }, { zh: '太', jyut: '太' },
            { zh: '一會兒', jyut: '一陣' }, { zh: '這樣', jyut: '咁樣' },
            { zh: '回家', jyut: '返屋企' }, { zh: '回來', jyut: '返嚟' }, { zh: '回去', jyut: '返去' },
            { zh: '拿', jyut: '攞' }, { zh: '找', jyut: '搵' }, { zh: '想', jyut: '諗' }, { zh: '來', jyut: '嚟' },
            { zh: '他', jyut: '佢' }, { zh: '她', jyut: '佢' }, { zh: '它', jyut: '佢' },
            { zh: '吃', jyut: '食' }, { zh: '喝', jyut: '飲' }, { zh: '看', jyut: '睇' }, { zh: '在', jyut: '喺' },
            { zh: '是不是', jyut: '係唔係' }, { zh: '就是', jyut: '就係' }, { zh: '還是', jyut: '定係' },
            { zh: '的話', jyut: '嘅話' }, { zh: '和', jyut: '同' }, { zh: '跟', jyut: '同' },
            { zh: '也', jyut: '都' }, { zh: '嗎', jyut: '呀' }, { zh: '吧', jyut: '啦' },
            { zh: '早上好', jyut: '早晨' }, { zh: '對不起', jyut: '對唔住' }, { zh: '沒關係', jyut: '冇所謂' },
            { zh: '謝謝', jyut: '多謝' }, { zh: '知道', jyut: '知' }, { zh: '剛才', jyut: '頭先' },
            { zh: '一起', jyut: '一齊' }, { zh: '聊天', jyut: '傾偈' }, 
            { zh: '的', jyut: '嘅' }, { zh: '是', jyut: '係' }, { zh: '了', jyut: '咗' }
        ].sort((a, b) => b.zh.length - a.zh.length);

        function convertToCantonese(text) {
            let result = text;
            for (const word of cantoneseDict) {
                const regex = new RegExp(word.zh, 'g');
                result = result.replace(regex, word.jyut);
            }
            return result;
        }

        // --- 自定義聲音視窗邏輯 ---
        const cvModal = document.getElementById('custom-voice-modal');

        function openCustomVoiceModal() {
            toggleDropdown(false);
            cvModal.classList.remove('hidden');
            
            const baseSelect = document.getElementById('cv-base-voice');
            baseSelect.innerHTML = '';
            const availableVoices = voices.length > 0 ? voices : (synth ? synth.getVoices() : []);
            availableVoices.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.voiceURI;
                opt.textContent = `${formatVoiceName(v.name)} (${v.lang})`;
                baseSelect.appendChild(opt);
            });
            
            document.getElementById('cv-name').value = '';
            document.getElementById('cv-pitch').value = '1';
            document.getElementById('cv-rate').value = '1';
            document.getElementById('cv-pitch-val').innerText = '1.0';
            document.getElementById('cv-rate-val').innerText = '1.0';
        }

        function closeCustomVoiceModal() {
            cvModal.classList.add('hidden');
        }

        document.getElementById('cv-pitch').addEventListener('input', (e) => {
            document.getElementById('cv-pitch-val').innerText = parseFloat(e.target.value).toFixed(1);
        });

        document.getElementById('cv-rate').addEventListener('input', (e) => {
            document.getElementById('cv-rate-val').innerText = parseFloat(e.target.value).toFixed(1);
        });

        function testCustomVoice() {
            const baseURI = document.getElementById('cv-base-voice').value;
            const voice = voices.find(v => v.voiceURI === baseURI);
            if (!voice) {
                showToast('請選擇基礎聲音', 'warning');
                return;
            }
            
            if (synth.speaking) synth.cancel();
            
            const u = new SpeechSynthesisUtterance('你好，這是一個自定義聲音的測試。');
            u.voice = voice;
            u.pitch = parseFloat(document.getElementById('cv-pitch').value);
            u.rate = parseFloat(document.getElementById('cv-rate').value);
            synth.speak(u);
        }

        function saveCustomVoice() {
            const name = document.getElementById('cv-name').value.trim() || `自定義聲音 ${customVoices.length + 1}`;
            const baseURI = document.getElementById('cv-base-voice').value;
            const pitch = parseFloat(document.getElementById('cv-pitch').value);
            const rate = parseFloat(document.getElementById('cv-rate').value);
            
            if (!baseURI) {
                showToast('沒有可用的基礎聲音！', 'error');
                return;
            }

            customVoices.push({ name, baseVoiceURI: baseURI, pitch, rate });
            localStorage.setItem('customVoices', JSON.stringify(customVoices));
            
            showToast('自定義聲音已成功儲存！', 'success');
            closeCustomVoiceModal();
            populateVoiceList();
        }

        // --- 通知提示系統 (Toast) ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800';
            let icon = 'fa-info-circle';
            if (type === 'success') {
                bgClass = 'bg-emerald-600';
                icon = 'fa-check-circle';
            } else if (type === 'error') {
                bgClass = 'bg-red-600';
                icon = 'fa-exclamation-circle';
            } else if (type === 'warning') {
                bgClass = 'bg-amber-500';
                icon = 'fa-triangle-exclamation';
            } else if (type === 'info') {
                bgClass = 'bg-blue-600';
                icon = 'fa-circle-info';
            }

            toast.className = `pointer-events-auto transform transition-all duration-300 translate-x-full opacity-0 flex items-center w-full max-w-xs p-4 text-white ${bgClass} rounded-xl shadow-lg`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-xl mr-3"></i>
                <div class="text-sm font-medium flex-1">${message}</div>
                <button type="button" class="ml-3 text-white/70 hover:text-white" onclick="this.parentElement.remove()">
                    <i class="fa-solid fa-times"></i>
                </button>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- 匯出 / 下載 MP3 邏輯 ---
        downloadMp3Btn.addEventListener('click', () => {
            let text = textInput.value.trim();
            if (text === '') {
                showToast('請先輸入要轉換的文字！', 'warning');
                textInput.focus();
                return;
            }

            if (languageSelect.value === 'zh-HK' && autoTranslateHk && autoTranslateHk.checked) {
                text = convertToCantonese(text);
            }

            const ttsText = text.length > 200 ? text.substring(0, 200) : text;

            let ttsLang = languageSelect.value;
            if (ttsLang === 'zh-HK') {
                ttsLang = 'yue';
            } else if (ttsLang === 'zh-CN') {
                ttsLang = 'zh-CN';
            } else if (ttsLang === 'en') {
                ttsLang = 'en-US';
            }

            const mp3Url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${ttsLang}&q=${encodeURIComponent(ttsText)}`;

            onlineMp3Player.src = mp3Url;
            onlineMp3Link.href = mp3Url;

            mp3ExportArea.classList.remove('hidden');
            mp3ExportArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            if (text.length > 200) {
                showToast('注意：MP3 匯出每次最多支援 200 字，已自動為您截取前 200 字。', 'warning');
            } else {
                showToast('已準備好 MP3 音檔，您可直接試聽或點擊開啟儲存！', 'success');
            }
        });

        // --- 本機即時朗讀邏輯 ---
        generateBtn.addEventListener('click', () => {
            if (!synth) {
                showToast('您的瀏覽器不支援語音合成功能。', 'error');
                return;
            }

            if (synth.speaking && !isPaused) {
                showToast('正在朗讀中，請先停止。', 'warning');
                return;
            }

            const text = textInput.value.trim();
            if (text === '') {
                showToast('請先輸入要轉換的文字！', 'warning');
                textInput.focus();
                return;
            }

            if (!selectedVoiceObj) {
                populateVoiceList();
                if (!selectedVoiceObj) {
                    showToast('未偵測到可用聲音，請稍候再試。', 'error');
                    return;
                }
            }

            let finalToSpeak = text;
            if (languageSelect.value === 'zh-HK' && autoTranslateHk && autoTranslateHk.checked) {
                finalToSpeak = convertToCantonese(text);
                showToast('已自動將書面語轉換為廣東話口語發音', 'info');
            }

            generateLocalAudio(finalToSpeak);
        });

        function generateLocalAudio(text) {
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = selectedVoiceObj;
            utterance.lang = selectedVoiceObj.lang || languageSelect.value;
            utterance.pitch = currentPitch;

            const selectedSpeed = parseFloat(speechRateSelect.value) || 1;
            utterance.rate = Math.max(0.1, Math.min(3, currentRate * selectedSpeed));
            
            utterance.onstart = () => {
                resultArea.classList.remove('hidden');
                setTimeout(() => {
                    resultArea.classList.remove('opacity-0');
                }, 50);

                isPaused = false;
                pauseResumeBtn.innerHTML = '<i class="fa-solid fa-pause mr-2"></i> 暫停';
                generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            };

            utterance.onend = () => {
                resultArea.classList.add('opacity-0');
                setTimeout(() => {
                    resultArea.classList.add('hidden');
                }, 300);
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                pauseResumeBtn.innerHTML = '<i class="fa-solid fa-pause mr-2"></i> 暫停 / 繼續';
            };

            utterance.onerror = (e) => {
                if (e.error !== 'interrupted' && e.error !== 'canceled') {
                    console.error('Speech synthesis error:', e);
                    showToast('語音引擎發生錯誤，請重新嘗試。', 'error');
                }
                resultArea.classList.add('hidden');
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            };

            synth.speak(utterance);
        }

        // 暫停 / 繼續按鈕
        pauseResumeBtn.addEventListener('click', () => {
            if (synth && synth.speaking) {
                if (synth.paused) {
                    synth.resume();
                    isPaused = false;
                    pauseResumeBtn.innerHTML = '<i class="fa-solid fa-pause mr-2"></i> 暫停';
                } else {
                    synth.pause();
                    isPaused = true;
                    pauseResumeBtn.innerHTML = '<i class="fa-solid fa-play mr-2"></i> 繼續';
                }
            }
        });

        // 停止播放按鈕
        stopBtn.addEventListener('click', () => {
            if (synth && synth.speaking) {
                synth.cancel();
                isPaused = false;
                pauseResumeBtn.innerHTML = '<i class="fa-solid fa-pause mr-2"></i> 暫停 / 繼續';
                
                resultArea.classList.add('opacity-0');
                setTimeout(() => {
                    resultArea.classList.add('hidden');
                }, 300);
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
